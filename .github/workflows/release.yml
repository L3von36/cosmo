name: Build & Release LoyPOS APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0). Leave empty to auto-generate v1.0.<run_number>.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (API 36)
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found at $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi

          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            set -o pipefail
          fi

          if [ -d "$SDK_ROOT/platforms/android-36" ] && [ -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            echo "Preinstalled Android SDK API 36 and Build Tools 36.0.0 found at $SDK_ROOT"
          else
            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager not found and API 36 SDK packages are missing under $SDK_ROOT"
              exit 1
            fi
            set +o pipefail
            { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            set -o pipefail
          fi

      - name: Cache Gradle 9.3.1 & dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle-dist/gradle-9.3.1
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-9.3.1-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-9.3.1-${{ runner.os }}-

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          GRADLE_DIR="$HOME/.gradle-dist/gradle-9.3.1"
          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            mkdir -p "$HOME/.gradle-dist"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" \
              -o /tmp/gradle-9.3.1-bin.zip
            unzip -q /tmp/gradle-9.3.1-bin.zip -d "$HOME/.gradle-dist"
            rm -f /tmp/gradle-9.3.1-bin.zip
          fi
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"
          "$GRADLE_DIR/bin/gradle" --version

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64"
          fi
          if [ ! -f debug.keystore ]; then
            echo "debug.keystore is missing (debug.keystore.base64 not found)"
            exit 1
          fi

      - name: Build Debug & Release APKs
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VER_NAME="${TAG#v}"
          gradle assembleDebug assembleRelease \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="$VER_NAME" \
            --no-daemon

      - name: Sign, align & verify APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p release-apks
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name "apksigner" | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name "zipalign" | sort -V | tail -n 1)

          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | sort | head -n 1)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            RAW_RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            RAW_RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            RAW_RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | sort | head -n 1)
          fi

          if [ -z "$DEBUG_APK" ] || [ -z "$RAW_RELEASE_APK" ]; then
            echo "APK build output missing (debug='$DEBUG_APK', release='$RAW_RELEASE_APK')"
            exit 1
          fi

          cp "$DEBUG_APK" release-apks/loypos-debug.apk

          # Ensure 16KB/4-byte alignment before final apksigner step
          "$ZIPALIGN" -f -P 16 4 "$RAW_RELEASE_APK" release-apks/loypos-release-aligned.apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
            "$APKSIGNER" sign \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --ks release.keystore \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "env:ANDROID_KEY_PASSWORD" \
              --out release-apks/loypos-release.apk \
              release-apks/loypos-release-aligned.apk
            rm -f release.keystore
          else
            echo "No custom release keystore secret set; signing release APK with debug.keystore (v2 + v3)."
            "$APKSIGNER" sign \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --ks debug.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out release-apks/loypos-release.apk \
              release-apks/loypos-release-aligned.apk
          fi
          rm -f release-apks/loypos-release-aligned.apk

          echo "Verifying alignment & signatures..."
          "$ZIPALIGN" -c -P 16 4 release-apks/loypos-debug.apk
          "$ZIPALIGN" -c -P 16 4 release-apks/loypos-release.apk
          "$APKSIGNER" verify --verbose --print-certs release-apks/loypos-debug.apk
          "$APKSIGNER" verify --verbose --print-certs release-apks/loypos-release.apk
          ls -lh release-apks/

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loypos-apks
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LoyPOS ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-apks/loypos-release.apk
            release-apks/loypos-debug.apk
